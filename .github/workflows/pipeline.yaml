name: Node.js CI/CD pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Node.js set up 
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencis
        run: npm Install

      - name: Run tests
        run: npm test

