name : Node.js CI pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        run: actions/checkout@v5

      - name: Set up Node.js
        run: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencis
        run: npm Install

      - name: Run tests
        run: npm test